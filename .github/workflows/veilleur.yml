name: Le Veilleur

on:
  schedule:
    # GitHub ne garantit pas ses déclenchements planifiés : il peut les retarder,
    # voire les sauter quand ses serveurs sont chargés. On en prévoit donc trois,
    # à une minute peu demandée. Le premier qui réussit envoie le journal,
    # les suivants voient que l'édition du jour est faite et s'arrêtent.
    # Heures UTC : 6 h 17, 7 h 17 et 8 h 17 à Paris en été, une heure plus tôt en hiver.
    - cron: "17 4 * * *"
    - cron: "17 5 * * *"
    - cron: "17 6 * * *"
  workflow_dispatch:   # bouton « Run workflow » pour lancer une édition à la main
    inputs:
      forcer:
        description: "Publier même si l'édition du jour est déjà partie"
        type: boolean
        default: false

permissions:
  contents: write      # seul droit accordé : pousser la mémoire sur la branche memoire

concurrency:
  group: veilleur      # jamais deux éditions en même temps sur la même mémoire
  cancel-in-progress: false

jobs:
  edition:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Europe/Paris
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # La mémoire passe en premier : elle dit si le travail du jour est déjà fait.
      - name: Récupérer la mémoire
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/memoire_git.sh recuperer

      - name: Vérifier si l'édition du jour est déjà partie
        id: etat
        run: |
          faite=$(python scripts/edition_faite.py data/veilleur.db)
          echo "faite=$faite" >> "$GITHUB_OUTPUT"
          if [ "$faite" = "oui" ]; then echo "L'édition du jour est déjà partie : rien à faire."; fi

      - name: Installer les dépendances
        if: steps.etat.outputs.faite != 'oui' || inputs.forcer
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Publier l'édition du jour
        if: steps.etat.outputs.faite != 'oui' || inputs.forcer
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'claude-haiku-4-5-20251001' }}
        run: python -m veille.main

      # Seulement si l'édition est partie : un échec ne doit rien enregistrer.
      - name: Sauvegarder la mémoire
        if: steps.etat.outputs.faite != 'oui' || inputs.forcer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/memoire_git.sh sauvegarder

      # Le PDF et la trace de l'agent restent téléchargeables deux semaines, même en cas d'échec.
      - name: Conserver le PDF et la trace
        if: always() && (steps.etat.outputs.faite != 'oui' || inputs.forcer)
        uses: actions/upload-artifact@v4
        with:
          name: edition-${{ github.run_id }}
          path: |
            out/*.pdf
            logs/
          retention-days: 14
          if-no-files-found: ignore
