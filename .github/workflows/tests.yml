name: Tests

on:
  push:
    branches-ignore: [memoire]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Les tests n'ont besoin ni du réseau, ni de clé API, ni du navigateur.
      - run: python -m pytest -q
